# Déploiement en un clic sur Render (https://render.com) : New > Blueprint > choisir ce dépôt.
services:
  - type: web
    name: mdia-eu
    runtime: docker
    plan: free               # sans disque : la base est sauvegardée dans un stockage S3 (voir README)
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /data/defer.db
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_FOYER
        sync: false
      - key: STRIPE_PRICE_ARTISAN
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
