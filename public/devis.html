<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Votre devis</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --text: #1d1d1b; --muted: #66655f; --line: #e2e0d8; --soft: #f7f7f4; --accent: #2f5d50; --accent-soft: #e3ece8; --warn: #a8551c; --warn-soft: #f8e9dc; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: var(--text); background: #f0efe9; margin: 0; padding: 16px; font-size: 15px; line-height: 1.5; }
    .page { background: #fff; max-width: 820px; margin: 0 auto; padding: 32px; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.06); }
    h1 { font-size: 26px; margin: 0 0 4px; }
    h2 { font-size: 18px; margin: 0 0 8px; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .box { background: var(--soft); border-radius: 8px; padding: 12px 16px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin: 16px 0; }
    th, td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { font-size: 12px; text-transform: uppercase; color: var(--muted); }
    .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .totals { margin-left: auto; max-width: 300px; }
    .totals td { border: none; padding: 4px 8px; }
    .totals tr.grand td { font-weight: 700; font-size: 17px; border-top: 2px solid var(--text); padding-top: 8px; }
    .notes { white-space: pre-wrap; margin-top: 16px; }
    .panel { margin-top: 28px; border: 2px solid var(--accent); border-radius: 12px; padding: 20px; }
    .banner { margin-top: 28px; border-radius: 12px; padding: 16px 20px; background: var(--accent-soft); }
    .banner.warn { background: var(--warn-soft); color: var(--warn); }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type=text], textarea { width: 100%; font: inherit; padding: 12px; border: 1px solid var(--line); border-radius: 8px; }
    .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; margin: 14px 0; }
    .check input { width: 20px; height: 20px; margin-top: 2px; flex: none; }
    .btn { display: inline-block; font: inherit; font-weight: 600; padding: 12px 20px; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; text-decoration: none; }
    .btn:disabled { opacity: .6; }
    .btn-light { background: #fff; color: var(--accent); }
    .btn-block { width: 100%; }
    .link { background: none; border: none; color: var(--muted); text-decoration: underline; font: inherit; cursor: pointer; padding: 0; margin-top: 16px; }
    .error { color: #a33a3a; margin-top: 8px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-bottom: 12px; max-width: 820px; margin-inline: auto; }
    .branding { margin-top: 24px; font-size: 11px; color: #9a998f; text-align: center; }
    .branding a { color: inherit; }
    .hidden { display: none; }
    .lines { display: none; list-style: none; padding: 0; margin: 16px 0; }
    .lines li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    @media (max-width: 600px) { .table-wrap { display: none; } .lines { display: block; } .totals { max-width: none; } }
    @media (max-width: 600px) { body { padding: 8px; } .page { padding: 20px 16px; } h1 { font-size: 22px; } }
  </style>
</head>
<body>
  <div class="actions"><a class="btn btn-light" id="pdf" href="#" download>Télécharger le PDF</a></div>
  <div class="page" id="page">Chargement…</div>
  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const eur = (n) => Number(n).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
    const frDate = (d) => (d ? new Date(`${d}T00:00:00`).toLocaleDateString('fr-FR') : '');
    const frDateTime = (s) => new Date(`${s.replace(' ', 'T')}Z`).toLocaleString('fr-FR', { dateStyle: 'long', timeStyle: 'short' });
    const token = location.pathname.split('/')[2] || '';
    const base = `/api/public/devis/${encodeURIComponent(token)}`;
    document.getElementById('pdf').href = `${base}/pdf`;

    async function call(path, body) {
      const res = await fetch(base + path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Une erreur est survenue. Réessayez.');
      return data;
    }

    function render({ document: d, issuer: me }) {
      const who = me.companyName || me.name;
      document.title = `Devis ${d.number} — ${who}`;
      const byRate = {};
      d.items.forEach((it) => (byRate[it.vat_rate] = (byRate[it.vat_rate] || 0) + (it.total_ht * it.vat_rate) / 100));
      let action;
      if (d.status === 'accepte') {
        action = `<div class="banner"><h2>Devis accepté</h2>${d.accepted_at
          ? `<p style="margin:0">Accepté en ligne le ${frDateTime(d.accepted_at)} par ${esc(d.accepted_name)}. ${esc(who)} a été prévenu. Merci !</p>`
          : `<p style="margin:0">Ce devis a été accepté.</p>`}</div>`;
      } else if (d.status === 'refuse') {
        action = `<div class="banner warn"><h2>Devis refusé</h2><p style="margin:0">Vous avez indiqué ne pas donner suite. Pour toute question, contactez ${esc(who)}${me.phone ? ` au ${esc(me.phone)}` : ''}.</p></div>`;
      } else if (d.expired) {
        action = `<div class="banner warn"><h2>Devis expiré</h2><p style="margin:0">Ce devis était valable jusqu’au ${frDate(d.due_date)}. Contactez ${esc(who)}${me.phone ? ` au ${esc(me.phone)}` : ''} pour en recevoir un nouveau.</p></div>`;
      } else {
        action = `<form class="panel" id="accept">
            <h2>Accepter ce devis</h2>
            <p class="muted small" style="margin-top:0">En acceptant, vous donnez votre accord à ${esc(who)} pour réaliser les travaux décrits ci-dessus.</p>
            <label for="name">Votre nom et prénom</label>
            <input type="text" id="name" autocomplete="name" required minlength="3" maxlength="120" value="${esc(d.client?.name || '')}">
            <label class="check"><input type="checkbox" id="ok" required> <span>Bon pour accord : j’accepte le devis ${esc(d.number)} d’un montant de <strong>${eur(d.total_ttc)} TTC</strong>.</span></label>
            <button class="btn btn-block" type="submit">Accepter le devis</button>
            <div class="error" id="err" role="alert"></div>
            <button class="link" type="button" id="show-refuse">Je ne souhaite pas donner suite</button>
          </form>
          <form class="panel hidden" id="refuse" style="border-color:var(--line)">
            <h2>Refuser ce devis</h2>
            <label for="reason">Un mot pour ${esc(who)} (facultatif)</label>
            <textarea id="reason" rows="3" maxlength="1000"></textarea>
            <p><button class="btn btn-light" type="submit">Refuser le devis</button></p>
            <div class="error" id="err2" role="alert"></div>
          </form>`;
      }
      document.getElementById('page').innerHTML = `
        <div class="top">
          <div>
            <h1>DEVIS</h1>
            <div class="muted">N° ${esc(d.number)} · ${frDate(d.issue_date)}</div>
            ${d.due_date ? `<div class="muted">Valable jusqu’au ${frDate(d.due_date)}</div>` : ''}
          </div>
          <div class="box">
            <strong>${esc(who)}</strong><br>
            ${me.address ? esc(me.address).replace(/\n/g, '<br>') + '<br>' : ''}
            ${me.phone ? esc(me.phone) + '<br>' : ''}${esc(me.email)}
            ${me.siret ? `<br><span class="small muted">SIRET : ${esc(me.siret)}</span>` : ''}
          </div>
        </div>
        ${d.client ? `<div class="box" style="max-width:320px"><div class="muted small">Pour</div><strong>${esc(d.client.name)}</strong>${d.client.address ? `<br>${esc(d.client.address)}` : ''}</div>` : ''}
        <div class="table-wrap"><table>
          <thead><tr><th>Désignation</th><th class="num">Qté</th><th class="num">Prix HT</th><th class="num">TVA</th><th class="num">Total HT</th></tr></thead>
          <tbody>${d.items.map((it) => `<tr><td>${esc(it.description)}</td><td class="num">${it.quantity} ${esc(it.unit)}</td>
            <td class="num">${eur(it.unit_price)}</td><td class="num">${it.vat_rate} %</td><td class="num">${eur(it.total_ht)}</td></tr>`).join('')}</tbody>
        </table></div>
        <ul class="lines">${d.items.map((it) => `<li><div><strong>${esc(it.description)}</strong>
          <div class="muted small">${it.quantity} ${esc(it.unit)} × ${eur(it.unit_price)} HT · TVA ${it.vat_rate} %</div></div>
          <div class="num">${eur(it.total_ht)}</div></li>`).join('')}</ul>
        <table class="totals"><tbody>
          <tr><td>Total HT</td><td class="num">${eur(d.total_ht)}</td></tr>
          ${Object.entries(byRate).map(([r, v]) => `<tr><td>TVA ${r} %</td><td class="num">${eur(v)}</td></tr>`).join('')}
          <tr class="grand"><td>Total TTC</td><td class="num">${eur(d.total_ttc)}</td></tr>
        </tbody></table>
        ${d.notes ? `<div class="notes">${esc(d.notes)}</div>` : ''}
        ${Number(d.total_tva) === 0 ? '<p class="small muted">TVA non applicable, art. 293 B du CGI.</p>' : ''}
        ${action}
        ${me.showBranding ? '<div class="branding">Devis envoyé avec <a href="/?utm=devis-en-ligne">MDIA</a>, l’assistant administratif des artisans</div>' : ''}`;

      const accept = document.getElementById('accept');
      if (!accept) return;
      accept.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = accept.querySelector('button[type=submit]');
        btn.disabled = true;
        try {
          render(await call('/accepter', { name: document.getElementById('name').value, accept: document.getElementById('ok').checked }));
          window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        } catch (err) {
          document.getElementById('err').textContent = err.message;
          btn.disabled = false;
        }
      });
      document.getElementById('show-refuse').addEventListener('click', () => {
        document.getElementById('refuse').classList.remove('hidden');
        document.getElementById('reason').focus();
      });
      document.getElementById('refuse').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!confirm('Confirmer le refus de ce devis ?')) return;
        try {
          render(await call('/refuser', { reason: document.getElementById('reason').value }));
        } catch (err) {
          document.getElementById('err2').textContent = err.message;
        }
      });
    }

    call('').then(render).catch((err) => {
      document.getElementById('page').innerHTML = `<h2>Devis indisponible</h2><p class="muted">${esc(err.message)}</p>`;
      document.getElementById('pdf').classList.add('hidden');
    });
  </script>
</body>
</html>
