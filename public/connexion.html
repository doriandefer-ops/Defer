<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Defer</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header"><div class="container"><a class="logo" href="/"><span class="logo-mark">D</span>Defer</a></div></header>
  <div class="auth-wrap">
    <form class="card auth-card" id="form">
      <h1>Connexion</h1>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="password">Mot de passe</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <p class="error" id="error"></p>
      <button class="btn btn-primary btn-block" type="submit">Se connecter</button>
      <p class="muted small" style="margin-top: 1em">Pas encore de compte ? <a href="/inscription">Créer un compte</a></p>
    </form>
  </div>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      const res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
      const body = await res.json();
      if (!res.ok) return (document.getElementById('error').textContent = body.error);
      location.href = '/app';
    });
  </script>
</body>
</html>
