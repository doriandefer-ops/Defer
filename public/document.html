<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document — MDIA</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #1d1d1b; background: #f0efe9; margin: 0; padding: 24px 16px; font-size: 14px; }
    .page { background: #fff; max-width: 820px; margin: 0 auto; padding: 48px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    .top { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 40px; }
    h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: .02em; }
    .muted { color: #66655f; }
    .box { background: #f7f7f4; border-radius: 8px; padding: 12px 16px; min-width: 220px; }
    table { width: 100%; border-collapse: collapse; margin: 24px 0; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #e2e0d8; text-align: left; }
    th { font-size: 12px; text-transform: uppercase; color: #66655f; }
    .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .totals { margin-left: auto; width: 280px; }
    .totals td { border: none; padding: 4px 8px; }
    .totals tr.grand td { font-weight: 700; font-size: 16px; border-top: 2px solid #1d1d1b; padding-top: 8px; }
    .notes { white-space: pre-wrap; margin-top: 24px; }
    .legal { margin-top: 40px; font-size: 11px; color: #66655f; }
    .branding { margin-top: 16px; font-size: 10px; color: #9a998f; text-align: right; }
    .branding a { color: inherit; }
    .toolbar { max-width: 820px; margin: 0 auto 16px; display: flex; gap: 8px; justify-content: flex-end; }
    .toolbar button { font: inherit; padding: 8px 16px; border-radius: 999px; border: 1px solid #2f5d50; background: #2f5d50; color: #fff; cursor: pointer; }
    @media (max-width: 600px) { .page { padding: 24px 16px; } }
    @media print { body { background: #fff; padding: 0; } .page { box-shadow: none; padding: 0; } .toolbar { display: none; } }
  </style>
</head>
<body>
  <div class="toolbar"><button onclick="window.print()">Imprimer / Enregistrer en PDF</button></div>
  <div class="page" id="page">Chargement…</div>
  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const eur = (n) => Number(n).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
    const frDate = (d) => (d ? new Date(`${d}T00:00:00`).toLocaleDateString('fr-FR') : '');
    const id = new URLSearchParams(location.search).get('id');
    fetch(`/api/documents/${encodeURIComponent(id)}`).then(async (res) => {
      const data = await res.json();
      const page = document.getElementById('page');
      if (!res.ok) return (page.textContent = data.error || 'Document introuvable.');
      const { document: d, issuer: me } = data;
      const isQuote = d.type === 'devis';
      document.title = `${isQuote ? 'Devis' : 'Facture'} ${d.number}`;
      const byRate = {};
      d.items.forEach((it) => (byRate[it.vat_rate] = (byRate[it.vat_rate] || 0) + (it.total_ht * it.vat_rate) / 100));
      page.innerHTML = `
        <div class="top">
          <div>
            <h1>${isQuote ? 'DEVIS' : 'FACTURE'}</h1>
            <div class="muted">N° ${esc(d.number)}</div>
            <div class="muted">Date : ${frDate(d.issue_date)}</div>
            ${d.due_date ? `<div class="muted">${isQuote ? 'Valable jusqu’au' : 'Échéance de paiement'} : ${frDate(d.due_date)}</div>` : ''}
          </div>
          <div class="box">
            <strong>${esc(me.companyName || me.name)}</strong><br>
            ${me.address ? esc(me.address).replace(/\n/g, '<br>') + '<br>' : ''}
            ${me.phone ? esc(me.phone) + '<br>' : ''}${esc(me.email)}<br>
            ${me.siret ? 'SIRET : ' + esc(me.siret) : ''}
          </div>
        </div>
        ${d.client ? `<div class="box" style="max-width:320px;margin-left:auto">
          <div class="muted" style="font-size:12px">${isQuote ? 'Destinataire' : 'Facturé à'}</div>
          <strong>${esc(d.client.name)}</strong><br>
          ${d.client.address ? esc(d.client.address) + '<br>' : ''}${esc(d.client.email || '')}</div>` : ''}
        <table>
          <thead><tr><th>Désignation</th><th class="num">Qté</th><th class="num">Prix unit. HT</th><th class="num">TVA</th><th class="num">Total HT</th></tr></thead>
          <tbody>${d.items.map((it) => `<tr><td>${esc(it.description)}</td><td class="num">${it.quantity} ${esc(it.unit)}</td>
            <td class="num">${eur(it.unit_price)}</td><td class="num">${it.vat_rate} %</td><td class="num">${eur(it.total_ht)}</td></tr>`).join('')}</tbody>
        </table>
        <table class="totals"><tbody>
          <tr><td>Total HT</td><td class="num">${eur(d.total_ht)}</td></tr>
          ${Object.entries(byRate).map(([r, v]) => `<tr><td>TVA ${r} %</td><td class="num">${eur(v)}</td></tr>`).join('')}
          <tr class="grand"><td>Total TTC</td><td class="num">${eur(d.total_ttc)}</td></tr>
        </tbody></table>
        ${d.notes ? `<div class="notes">${esc(d.notes)}</div>` : ''}
        ${isQuote
          ? '<p class="notes">Bon pour accord — date et signature du client :<br><br><br></p>'
          : ''}
        <div class="legal">${isQuote
          ? 'Devis gratuit. Les prix sont exprimés en euros.'
          : 'En cas de retard de paiement, des pénalités au taux de trois fois le taux d’intérêt légal sont exigibles, ainsi qu’une indemnité forfaitaire de 40 € pour frais de recouvrement (art. L441-10 du Code de commerce). Pas d’escompte pour paiement anticipé.'}
          ${Number(d.total_tva) === 0 ? '<br>TVA non applicable, art. 293 B du CGI.' : ''}</div>
        ${me.showBranding ? '<div class="branding">Document créé avec <a href="https://mdia.onrender.com/?utm=document">MDIA</a>, l’assistant administratif des artisans</div>' : ''}`;
    });
  </script>
</body>
</html>
